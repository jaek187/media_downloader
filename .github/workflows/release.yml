name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: media-downloader-windows.zip
          - os: ubuntu-latest
            asset: media-downloader-linux-x86_64.tar.gz
          - os: macos-15-intel
            asset: media-downloader-macos-x86_64.tar.gz
          - os: macos-latest
            asset: media-downloader-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Validate source and extension manifest
        run: |
          python -m compileall -q server.py
          python -c "import json; json.load(open('extension/manifest.json', encoding='utf-8'))"
      - name: Build local service (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name media-downloader-server --collect-all imageio_ffmpeg server.py
      - name: Build local service (Linux and macOS)
        if: runner.os != 'Windows'
        run: pyinstaller --onefile --name media-downloader-server --collect-all imageio_ffmpeg server.py
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item dist/media-downloader-server.exe stage/
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ffmpeg stage/ffmpeg.exe
          Copy-Item -Recurse extension stage/extension
          Compress-Archive -Path stage/* -DestinationPath ${{ matrix.asset }}
      - name: Package Unix release
        if: runner.os != 'Windows'
        run: |
          mkdir stage
          cp dist/media-downloader-server stage/
          chmod +x stage/media-downloader-server
          cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" stage/ffmpeg
          chmod +x stage/ffmpeg
          cp -R extension stage/extension
          tar -czf "${{ matrix.asset }}" -C stage .
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect release archives
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
